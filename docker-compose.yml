services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env.docker
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER:-app}\" -d \"$${POSTGRES_DB:-clubsdb}\""]
      interval: 5s
      retries: 10

  clubservice:
    build: .
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8000"

volumes:
  postgres-data: {}
